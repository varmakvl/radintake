name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RADINTAKE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - name: Install
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; fi
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (end-to-end, offline)
        run: pytest tests/integration -m integration -q --timeout=1800
      - name: Eval regression gate
        # runs even when the unit tests fail, so a regression shows both signals
        if: (success() || failure()) && hashFiles('eval/baseline.json') != ''
        run: python -m radintake.eval.gate --subset ci
