[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radintake"
version = "0.1.0"
description = "Multi-agent, PHI-safe intake of scanned radiology reports and DICOM: extraction, verification, cited retrieval, evaluation harness."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
# Exact pins live in requirements.lock (generated with `uv pip compile`).
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.3",
  "pydicom>=2.4",
  "rapidfuzz>=3.9",
  "structlog>=24.1",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.5", "img2pdf>=0.5"]

[project.scripts]
radintake = "radintake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that run the real pipeline (batch CLI and API) on synthetic fixtures",
]
addopts = "-ra"
timeout = 900

[tool.ruff]
line-length = 110
target-version = "py311"
