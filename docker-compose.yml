# One-command stack: docker compose up -d --build --wait   (API on http://localhost:8000)
# All models are local and open source: the VLM runs in Ollama on the host (OLLAMA_HOST).
services:
  api:
    build: .
    image: radintake:latest
    ports:
      - "8000:8000"
    environment:
      RADINTAKE_OFFLINE: "${RADINTAKE_OFFLINE:-1}"
      RADINTAKE_DATA_DIR: /data
      RADINTAKE_TRACE_DIR: /data/traces
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - radintake-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Optional GPU OCR/VLM variant: docker compose --profile ocr-gpu up -d --build --wait
  api-gpu:
    profiles: ["ocr-gpu"]
    build: .
    image: radintake:latest
    ports:
      - "8001:8000"
    environment:
      RADINTAKE_OFFLINE: "${RADINTAKE_OFFLINE:-1}"
      RADINTAKE_DATA_DIR: /data
      RADINTAKE_TRACE_DIR: /data/traces
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - radintake-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  radintake-data:
