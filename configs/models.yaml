# Model registry: every model the pipeline may call. Recorded in every run manifest.
# kind: local -> runs on this machine (allowed under RADINTAKE_OFFLINE=1)
#       api   -> network call to an external provider (refused under RADINTAKE_OFFLINE=1,
#                and only ever sent PHI-masked payloads)
models:
  ocr:
    id: tesseract-5
    kind: local
    version: "5.x (pytesseract>=0.3.10; CPU, OEM 1 LSTM, PSM 6, OMP_THREAD_LIMIT=1)"
  vlm_local:              # crop transcription only (<OCR> task); ~0.23B params, fp16 fits the 4 GB GPU.
    id: microsoft/Florence-2-base   # used only when transformers is installed AND the weights are
    kind: local                     # already in the local HF cache (never downloaded at run time)
  vlm_api:                # VLM-first / hybrid page reading; only ever sent PHI-masked images.
    id: claude-sonnet-4-5 # key from the ANTHROPIC_API_KEY environment variable only
    kind: api
    usd_per_mtok_in: 3.0  # pricing for the per-call cost in traces
    usd_per_mtok_out: 15.0
  embedder:
    id: sentence-transformers/all-MiniLM-L6-v2
    kind: local
