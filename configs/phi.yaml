# PHI agent (documents): label anchors, regex patterns and masking parameters.
# Loaded by radintake.agents.phi; a `phi:` section in a --config YAML overrides these keys.
# All regexes are Python `re` syntax, matched case-insensitively.

# Layer 1 - layout anchors: a label on an OCR line; the value is the tokens to its RIGHT,
# up to the next anchor label or the end of the line. `type` is the placeholder/detection type.
anchors:
  - type: PATIENT_NAME
    pattern: '\b(?:patient\s*name|pt\.?\s*name|name\s+of\s+patient)\s*[:#.]?'
  - type: PATIENT_NAME    # bare "Patient:" label (colon required, so prose like "patient is" never matches)
    pattern: '\bpatient\s*:'
  - type: PATIENT_ID
    pattern: '\b(?:patient\s*id|pt\.?\s*id|patient\s*no\.?|medical\s*record\s*(?:no\.?|number)?)\s*[:#.]?'
  - type: PATIENT_ID
    pattern: '\bmrn\s*[:#.]|\bmrn(?=\s)'
  - type: DATE_OF_BIRTH
    pattern: '\b(?:date\s*of\s*birth|birth\s*date|d\.?o\.?b\.?)\s*[:#.]?'
  - type: ACCESSION_NUMBER
    pattern: '\b(?:accession|acc\.?)\s*(?:no\.?|number|num\.?|#)?\s*[:#.]?(?=\s|$)'
  # clinician labels: their values are PHI too, and the label ends a patient value on the same line
  - type: REFERRING_PHYSICIAN
    pattern: '\b(?:referring|ordering)(?:\s+(?:physician|provider|doctor|md))?\s*:'

# Layer 2 - regex over every token/sentence (IDs, accession formats, dates).
regex:
  - type: PATIENT_ID
    pattern: '\bMRN[-#:]?\s?\d{4,}\b'
  - type: ACCESSION_NUMBER
    pattern: '\bACC(?:N)?[-#:]?\s?\d{4,}\b'
  - type: ID
    pattern: '\b\d{7,}\b'
  - type: DATE
    pattern: '\b(?:19|20)\d{2}[-/.](?:0?[1-9]|1[0-2])[-/.](?:0?[1-9]|[12]\d|3[01])\b'
  - type: DATE
    pattern: '\b(?:0?[1-9]|[12]\d|3[01])[-/.](?:0?[1-9]|1[0-2])[-/.](?:19|20)?\d{2}\b'
  - type: DATE
    pattern: '\b(?:0?[1-9]|1[0-2])[-/.](?:0?[1-9]|[12]\d|3[01])[-/.](?:19|20)?\d{2}\b'
  - type: DATE
    pattern: '\b\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(?:19|20)\d{2}\b'
  - type: DATE
    pattern: '\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+\d{1,2},?\s+(?:19|20)\d{2}\b'

# Layer 3 - names in free text. `ner: auto` uses Presidio (spaCy) when it imports offline,
# else the lightweight honorific fallback below. `ner: fallback` forces the fallback.
ner: auto
honorifics: ['dr', 'doctor', 'prof', 'professor', 'mr', 'mrs', 'ms', 'miss', 'mx']

mask:
  pad_px: 6               # boxes are grown by this many pixels before filling (original coords)
  fill: background        # "background" (page 95th percentile grey) or an integer 0..255

# Layer 4 - handwritten sign-offs (agents/phi.py HandwritingPass, tools/handwriting.py).
# Runs AFTER layers 1-3 on the page with their detections already filled; reads only crops
# (a) next to a credential anchor (RT, MD ... / a sign-off label) and (b) of low-confidence lines in
# the sign-off zone, with a LOCAL handwriting model (models.hw_reader). Recognised text goes back
# through layers 1-3; names found are masked on the OCR words of the crop (original coords).
# enabled: auto -> used only when transformers + torch are installed AND the weights are already
# cached; otherwise the stage records a skip reason and the output is unchanged (CI path).
handwriting:
  enabled: auto
  model: hw_reader                 # registry name in configs/models.yaml (must be kind: local)
  credentials: '^(?:RT|R\.T\.|RT\(R\)|RRT|ARRT|MD|M\.D\.|DO|RN|NP|PA-C)[,.;:]?$'   # one OCR token, case-sensitive
  labels: '\b(?:technologist|tech|signature|sign-?off)\s*:|\b(?:signed|read|performed|dictated)\s+by\b'
  separators: '^(?:[—–~=_|:\-]+|by)$'   # left boundary of a name before a credential
  max_name_words: 4                # OCR words taken left of a credential (wrapping onto the previous line)
  low_conf: 0.6                    # a sign-off-zone line with a word below this is read
  zone_frac: 0.3                   # sign-off zone when no anchor is found: bottom fraction of the page
  max_crops_per_page: 8
  max_low_conf_crops_per_page: 2    # dev: low-confidence crops added 0 of 14 detections but ~0.9 s/page
  crop_pad: 0.25                   # crop padding, fraction of the crop height
  word_overlap: 0.4                # a name span must cover this fraction of an OCR word's width
  max_new_tokens: 20               # a sign-off is ~10 tokens; caps the cost of illegible crops
